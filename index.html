<title>Creator Control Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column. Challenge slate on top, three tabs, one job per tab. */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --surface-2:#e9ebef; --ink:#14161a; --ink-2:#474c56; --ink-3:#6b717c; --line:#d7dae1;
  --accent:#d63a2c; --accent-soft:#fbe3e0; --focus:#2a78d6;
  --s-tt:#1baf7a; --s-ig:#eb6834; --s-yt:#2a78d6;
  --good:#0a7d0a; --bad:#c53030; --bad-soft:#fbe4e4;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101215; --surface:#181b20; --surface-2:#22262c; --ink:#eef0f3; --ink-2:#b6bcc6; --ink-3:#8a919c; --line:#2d3239;
  --accent:#ff5b4d; --accent-soft:#3b1f1c; --focus:#5598e7;
  --s-tt:#199e70; --s-ig:#d95926; --s-yt:#3987e5;
  --good:#3fbf3f; --bad:#f06a6a; --bad-soft:#3a1c1c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101215; --surface:#181b20; --surface-2:#22262c; --ink:#eef0f3; --ink-2:#b6bcc6; --ink-3:#8a919c; --line:#2d3239;
  --accent:#ff5b4d; --accent-soft:#3b1f1c; --focus:#5598e7;
  --s-tt:#199e70; --s-ig:#d95926; --s-yt:#3987e5;
  --good:#3fbf3f; --bad:#f06a6a; --bad-soft:#3a1c1c; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-stretch:115%;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--ink-3)}
.small{font-size:.85rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

header h1{font-size:1.15rem;font-weight:900;font-stretch:125%;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:1.2rem}
.card h3{font-size:1rem}

/* challenge slate */
.slate{border:1.5px solid var(--ink)}
.slate-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.day{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:2.2rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.day small{font-size:1rem;color:var(--ink-3);font-weight:700;letter-spacing:0}
.rec{font-family:var(--f-mono);font-size:.75rem;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:6px}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.rec.done{color:var(--good)} .rec.done i{background:var(--good)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.plats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.plat-btn{justify-content:center;gap:8px;padding-inline:8px}
.plat-btn i{width:9px;height:9px;border-radius:3px;flex:none}
.plat-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plat-btn[aria-pressed="true"]:hover{background:var(--ink)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:10px;padding:4px;gap:4px}
.tabs a{text-align:center;text-decoration:none;color:var(--ink-2);font-weight:600;padding:9px 6px;border-radius:7px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* controls */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--ink-2);min-width:0}
input[type=text],input[type=url],input[type=number],select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:110px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
input[type=file]{font-size:.82rem;color:var(--ink-2);max-width:100%}
button{font:inherit;font-size:.9rem;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{background:var(--surface-2)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);justify-content:center;padding:11px 16px}
button.primary:hover{opacity:.88;background:var(--ink)}
button.ghost{border-color:transparent;background:transparent;color:var(--ink-3);padding:4px 8px;font-size:.8rem}
button.ghost:hover{color:var(--ink);background:var(--surface-2)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.or{font-size:.8rem;color:var(--ink-3);display:flex;align-items:center;gap:10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.add{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:600px){.add{grid-template-columns:repeat(2,minmax(0,1fr))}.add .full{grid-column:1/-1}}

/* lists and output */
.list{display:flex;flex-direction:column}
.item{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.item-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.item-head .t{font-weight:600;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.item-head .t:hover{text-decoration:underline}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.7rem;font-weight:600;color:var(--ink-3)}
.tag i{width:8px;height:8px;border-radius:2px}
.out{white-space:pre-wrap;font-size:.88rem;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:420px;overflow:auto;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--ink-3);font-size:.9rem;padding:18px 8px}
.note{font-size:.85rem;border-radius:8px;padding:10px 12px;background:var(--surface-2);color:var(--ink-2)}
.note.err{background:var(--bad-soft);color:var(--bad)}
details summary{cursor:pointer;font-size:.82rem;color:var(--ink-3);font-weight:600}
details[open] summary{margin-bottom:8px}
.hook{font-weight:700;font-size:1rem;min-width:0;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.tile .k{font-size:.72rem;color:var(--ink-3);font-weight:600}
.tile .n{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .s{font-size:.75rem;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md{font-size:.92rem;line-height:1.6}
.md h4{font-family:var(--f-display);font-stretch:112%;font-size:.95rem;margin:12px 0 2px}
.md h4:first-child{margin-top:0}
.md ul{margin:2px 0 6px;padding-left:20px}
.md p{margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.85rem;font-weight:600;z-index:20}
</style>

<div class="wrap">
  <header class="row" style="justify-content:space-between">
    <h1>Creator Control Room</h1>
    <span class="small muted" id="status"></span>
  </header>

  <section class="card slate" id="slate" aria-label="90-day challenge"></section>

  <nav class="tabs" aria-label="Sections">
    <a href="#recreate" data-tab="recreate">Recreate</a>
    <a href="#ideas" data-tab="ideas">Ideas</a>
    <a href="#stats" data-tab="stats">Stats</a>
  </nav>

  <!-- RECREATE -->
  <section id="v-recreate" class="view">
    <form class="card" id="rc-form" autocomplete="off">
      <h2>Recreate a video</h2>
      <input type="url" id="rc-url" aria-label="Video link" placeholder="Video link (TikTok, Instagram or YouTube)">
      <textarea id="rc-text" aria-label="Transcript" placeholder="Paste the transcript or captions"></textarea>
      <div class="or">or</div>
      <label class="f">Upload the video file and Claude reads it<input type="file" id="rc-file" accept="video/*"></label>
      <button type="submit" class="primary" id="rc-go">Make my editor prompt</button>
      <div id="rc-msg"></div>
    </form>
    <div class="card">
      <h3>Your videos</h3>
      <div class="list" id="rc-list"></div>
    </div>
  </section>

  <!-- IDEAS -->
  <section id="v-ideas" class="view" hidden>
    <form class="card" id="id-form" autocomplete="off">
      <h2>Video ideas</h2>
      <textarea id="id-news" aria-label="News or trends" placeholder="Optional: paste news, tweets or trends you want ideas about"></textarea>
      <button type="submit" class="primary" id="id-go">Give me 8 ideas</button>
      <div id="id-msg"></div>
    </form>
    <div class="card"><div class="list" id="id-list"></div></div>
  </section>

  <!-- STATS -->
  <section id="v-stats" class="view" hidden>
    <div class="tiles" id="st-tiles"></div>
    <form class="card" id="st-form" autocomplete="off">
      <h2>Log a post</h2>
      <div class="add">
        <label class="f full">Video<input type="text" id="st-title" placeholder="What was it?"></label>
        <label class="f">Platform<select id="st-plat"><option value="tt">TikTok</option><option value="ig">Instagram</option><option value="yt">YouTube</option></select></label>
        <label class="f">Views<input type="number" min="0" id="st-views" inputmode="numeric"></label>
        <label class="f">Likes<input type="number" min="0" id="st-likes" inputmode="numeric"></label>
        <button type="submit" class="primary full">Add</button>
      </div>
    </form>
    <div class="card">
      <div class="item-head"><h3>What's working</h3><button type="button" id="an-go">Analyze my stats</button></div>
      <div id="an-out"></div>
    </div>
    <div class="card">
      <h3>Posts</h3>
      <div class="list" id="st-list"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
const PLATS = [{id:'tt',name:'TikTok',c:'var(--s-tt)'},{id:'ig',name:'Instagram',c:'var(--s-ig)'},{id:'yt',name:'YouTube',c:'var(--s-yt)'}];
const PLAT = Object.fromEntries(PLATS.map(p => [p.id, p]));
const ABOUT = 'A creator building a personal brand with short-form videos about startups, AI, tech news, skits and general life, cross-posted to TikTok, Instagram Reels and YouTube Shorts. Goal: grow an audience and go viral consistently. Currently doing a 90-day daily posting challenge.';
const DAYS = 90;

const S = { db:null, sample:null, imgMax:0, live:false, videos:[], posts:[], ideas:[], analysis:null, start:'', days:{}, open:null, confirm:null, busy:{} };

/* utils */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parseIso = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const addDays = (s,n) => { const d = parseIso(s); d.setDate(d.getDate()+n); return iso(d); };
const diff = (a,b) => Math.round((parseIso(b)-parseIso(a))/86400000);
const fmtDate = s => s ? parseIso(s).toLocaleDateString(undefined,{month:'short',day:'numeric'}) : '';
const compact = n => { n = num(n); const a = Math.abs(n); if (a>=1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M'; if (a>=1e3) return (n/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,'')+'K'; return String(Math.round(n)); };
const tag = id => PLAT[id] ? `<span class="tag"><i style="background:${PLAT[id].c}"></i>${PLAT[id].name}</span>` : '';
const detect = u => { u = String(u||'').toLowerCase(); return u.includes('tiktok.') ? 'tt' : u.includes('instagram.') ? 'ig' : u.includes('youtu') ? 'yt' : ''; };
function toast(m){ const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=>t.hidden = true, 2000); }
function msg(id, text, err){ $(id).innerHTML = text ? `<div class="note ${err?'err':''}">${esc(text)}</div>` : ''; }
async function copy(text, btn){ try { await navigator.clipboard.writeText(text); toast('Copied'); if (btn){ const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(()=>btn.textContent = o, 1200); } } catch(e){ toast('Copy blocked. Select the text and copy it.'); } }
function md(text){ let h = '', ul = false; const il = s => s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  for (const raw of esc(text).split('\n')){ const l = raw.trim();
    if (/^[-*•] /.test(l)){ if (!ul){ h += '<ul>'; ul = true; } h += `<li>${il(l.slice(2))}</li>`; continue; }
    if (ul){ h += '</ul>'; ul = false; }
    if (/^#{1,4} /.test(l)) h += `<h4>${il(l.replace(/^#+ /,''))}</h4>`; else if (l) h += `<p>${il(l)}</p>`; }
  return h + (ul ? '</ul>' : ''); }
function aiErr(e){ const c = e && e.code;
  if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)) return "Claude isn't allowed on this page yet. Allow it from the page's permissions and try again.";
  return ({cancelled:'Stopped.', rate_limited:"You've hit your Claude limit for now. Try again later.", refused:'Claude declined this one. Try different text.', invalid_json:'Something came back garbled. Press the button again.', prompt_too_large:'That transcript is too long. Paste a shorter part.', image_rejected:"Couldn't read that video. Try another file or paste the transcript.", images_unavailable:"Video upload doesn't work in this view. Paste the transcript instead."})[c] || "Couldn't reach Claude. Try again."; }

/* storage */
const q = {};
const enqueue = (k, fn) => (q[k] = (q[k] || Promise.resolve()).then(fn, fn)).catch(() => toast("Couldn't save. Check your connection."));
function putDoc(col, id, data){ const i = S[col].findIndex(x => x.id === id); const rec = {...data, id}; if (i >= 0) S[col][i] = rec; else S[col].unshift(rec); render(); if (S.db){ const b = {...data}; delete b.id; enqueue(col+'/'+id, () => S.db.collection(col).doc(id).set(b)); } }
function delDoc(col, id){ S[col] = S[col].filter(x => x.id !== id); render(); if (S.db) enqueue(col+'/'+id, () => S.db.collection(col).doc(id).delete()); }
function putMeta(id, data){ if (S.db) enqueue('meta/'+id, () => S.db.doc('meta/'+id).set(data)); }
const saveChallenge = () => putMeta('challenge', {start:S.start, days:S.days});

async function boot(){
  route();
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){ $('status').textContent = 'Not saving: open this page in Claude'; return; }
  c.use('sample').then(async s => { S.sample = s; if (s){ try { const l = await s.limits(); S.imgMax = l.images ? l.images.maxCount : 0; } catch(e){} } render(); });
  const db = await c.use('db');
  if (!db){ $('status').textContent = 'Not saving: open this page in Claude'; return; }
  S.db = db; $('status').textContent = 'Loading…';
  const timer = setTimeout(() => { if (!S.live) $('status').textContent = "Can't reach your saved data yet"; }, 10000);
  const ok = snap => { if (!snap.metadata.fromCache && !S.live){ S.live = true; clearTimeout(timer); $('status').textContent = ''; } };
  const fail = () => { clearTimeout(timer); $('status').textContent = 'Lost connection. Reload the page.'; };
  for (const col of ['videos','posts']) db.collection(col).onSnapshot(snap => { S[col] = snap.docs.map(d => ({...d.data(), id:d.id})).sort((a,b) => num(b.createdAt)-num(a.createdAt)); ok(snap); render(); }, fail);
  db.doc('meta/challenge').onSnapshot(snap => { const d = snap.exists ? snap.data() : {}; S.start = d.start || ''; S.days = d.days ? JSON.parse(JSON.stringify(d.days)) : {}; ok(snap); render(); }, fail);
  db.doc('meta/ideas').onSnapshot(snap => { const d = snap.exists ? snap.data() : {}; S.ideas = Array.isArray(d.list) ? d.list : []; ok(snap); render(); }, fail);
  db.doc('meta/analysis').onSnapshot(snap => { S.analysis = snap.exists ? snap.data() : null; ok(snap); render(); }, fail);
}

/* routing */
const VIEWS = ['recreate','ideas','stats'];
let view = 'recreate';
function route(){ const h = location.hash.slice(1); view = VIEWS.includes(h) ? h : 'recreate';
  for (const v of VIEWS) $('v-'+v).hidden = v !== view;
  document.querySelectorAll('.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === view ? 'page' : 'false')); render(); }
window.addEventListener('hashchange', route);

/* challenge: a day counts when you post on at least one platform */
function posted(date){ const m = S.days[date] || {}; const o = {}; for (const p of PLATS) o[p.id] = !!m[p.id] || S.posts.some(x => x.date === date && x.platform === p.id); return o; }
const doneDay = d => Object.values(posted(d)).some(Boolean);
function streak(){ const t = today(); let d = doneDay(t) ? t : addDays(t,-1), n = 0; while (S.start && d >= S.start && doneDay(d)){ n++; d = addDays(d,-1); } return n; }

/* render */
function render(){ renderSlate(); ({recreate:renderRecreate, ideas:renderIdeas, stats:renderStats})[view](); }

function renderSlate(){
  const el = $('slate'); const t = today();
  if (!S.start){
    el.innerHTML = `<div class="slate-top"><div><div class="day">DAY 0<small> /90</small></div><p class="small muted" style="margin-top:6px">Post every day for 90 days.</p></div><button type="button" class="primary" id="ch-start">Start the challenge today</button></div>`;
    return;
  }
  const n = Math.min(DAYS, Math.max(1, diff(S.start, t) + 1));
  let done = 0; for (let i = 0; i < n; i++) if (doneDay(addDays(S.start, i))) done++;
  const p = posted(t); const st = streak(); const td = doneDay(t);
  el.innerHTML = `
    <div class="slate-top">
      <div class="day">DAY ${n}<small> /90</small></div>
      <span class="rec ${td?'done':''}"><i></i>${td ? 'Posted today' : 'Not posted yet'}</span>
    </div>
    <div class="bar" aria-label="${done} of 90 days done"><i style="width:${(done/DAYS*100).toFixed(1)}%"></i></div>
    <p class="small muted"><b class="mono" style="color:var(--ink)">${st}</b> day streak · <b class="mono" style="color:var(--ink)">${done}</b> of ${n} days done · tap where you posted today</p>
    <div class="plats">${PLATS.map(x => `<button type="button" class="plat-btn" data-day-plat="${x.id}" aria-pressed="${p[x.id]}"><i style="background:${x.c}"></i>${x.name}</button>`).join('')}</div>`;
}

function renderRecreate(){
  $('rc-go').disabled = !!S.busy.rc || !S.sample;
  if (!S.videos.length && !S.busy.rc){ $('rc-list').innerHTML = `<div class="empty">Videos you recreate show up here, each with its editor prompt.</div>`; return; }
  const pending = S.busy.rc ? `<div class="item"><div class="item-head"><span class="t">Working on it…</span></div><div class="out" id="rc-live">${esc(S.busy.rcText || 'Claude is reading the video. This takes about a minute.')}</div></div>` : '';
  $('rc-list').innerHTML = pending + S.videos.map(v => {
    const open = S.open === v.id;
    return `<div class="item">
      <div class="item-head"><span class="t" data-open="${esc(v.id)}" role="button" tabindex="0" aria-expanded="${open}">${esc(v.title || 'Untitled video')}</span>
        <div class="row" style="flex-wrap:nowrap">${tag(v.platform)}<button type="button" data-copy="${esc(v.id)}">Copy prompt</button></div></div>
      ${open ? `
        <div class="out">${esc(v.prompt || '')}</div>
        ${v.transcript ? `<details><summary>Transcript</summary><div class="out">${esc(v.transcript)}</div></details>` : ''}
        <div class="row" style="justify-content:space-between">${v.url ? `<a class="small" href="${esc(v.url)}" target="_blank" rel="noopener">Open original ↗</a>` : '<span></span>'}
          <button type="button" class="ghost" data-del-video="${esc(v.id)}">${S.confirm === v.id ? 'Tap again to delete' : 'Delete'}</button></div>` : ''}
    </div>`; }).join('');
}

function renderIdeas(){
  $('id-go').disabled = !!S.busy.ideas || !S.sample;
  $('id-list').innerHTML = S.ideas.length ? S.ideas.map((i, k) => `
    <div class="item">
      <div class="item-head"><span class="hook">“${esc(i.hook)}”</span><button type="button" class="ghost" data-copy-idea="${k}">Copy</button></div>
      <span class="small"><b>${esc(i.title)}</b> · ${esc(i.why)}</span>
    </div>`).join('') : `<div class="empty">Your ideas show up here. Each one comes with the first line to say on camera.</div>`;
}

function renderStats(){
  $('an-go').disabled = !!S.busy.an || !S.sample || !S.posts.length;
  const t = today(), wk = S.posts.filter(p => p.date >= addDays(t,-6));
  const views = wk.reduce((s,p) => s + num(p.views), 0);
  const best = [...S.posts].sort((a,b) => num(b.views)-num(a.views))[0];
  $('st-tiles').innerHTML = `
    <div class="tile"><div class="k">Views this week</div><div class="n">${compact(views)}</div><div class="s">last 7 days</div></div>
    <div class="tile"><div class="k">Posts this week</div><div class="n">${wk.length}</div><div class="s">all platforms</div></div>
    <div class="tile"><div class="k">Best post</div><div class="n">${best ? compact(best.views) : '–'}</div><div class="s" title="${best ? esc(best.title) : ''}">${best ? esc(best.title) : 'none yet'}</div></div>`;
  $('st-list').innerHTML = S.posts.length ? S.posts.slice(0, 30).map(p => `
    <div class="item"><div class="item-head">
      <div style="min-width:0"><div style="font-weight:600;overflow-wrap:anywhere">${esc(p.title)}</div><div class="row small muted" style="gap:10px">${tag(p.platform)}<span>${fmtDate(p.date)}</span></div></div>
      <div class="row" style="flex-wrap:nowrap"><div style="text-align:right"><div class="mono" style="font-weight:600">${compact(p.views)}</div><div class="small muted" style="white-space:nowrap">${compact(p.likes)} likes</div></div>
      <button type="button" class="ghost" data-del-post="${esc(p.id)}" aria-label="Delete post">${S.confirm === p.id ? 'Delete?' : '✕'}</button></div>
    </div></div>`).join('') : `<div class="empty">Log each video after you post it. It also counts toward your challenge.</div>`;
  const out = $('an-out');
  if (S.busy.an) out.innerHTML = `<div class="md">${md(S.busy.an)}</div>`;
  else if (S.analysis && S.analysis.text) out.innerHTML = `<div class="md">${md(S.analysis.text)}</div>`;
  else out.innerHTML = `<p class="small muted">Log a few posts, then let Claude tell you what to do more of.</p>`;
}

/* AI: recreate */
async function extractFrames(file, n){
  const url = URL.createObjectURL(file); const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  try {
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = rej; setTimeout(rej, 15000); });
    const dur = v.duration; const times = [];
    for (const t of [0.2, 1.2, 2.5]) if (t < dur && times.length < n) times.push(t);
    const rest = n - times.length, from = Math.min(dur, 4);
    for (let i = 0; i < rest; i++) times.push(Math.min(dur - 0.1, from + (dur - from) * (i + 0.5) / rest));
    const sc = Math.min(1, 900 / Math.max(v.videoWidth, v.videoHeight)); const cv = document.createElement('canvas');
    cv.width = Math.round(v.videoWidth*sc); cv.height = Math.round(v.videoHeight*sc); const ctx = cv.getContext('2d'); const out = [];
    for (const t of times){
      await new Promise(res => { const h = () => { v.removeEventListener('seeked', h); clearTimeout(to); res(); }; const to = setTimeout(h, 3000); v.addEventListener('seeked', h); v.currentTime = Math.max(0, t); });
      ctx.drawImage(v, 0, 0, cv.width, cv.height); const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82)); if (b) out.push({t, blob:b});
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}
function section(text, name){ const m = text.match(new RegExp('===' + name + '===\\s*([\\s\\S]*?)(?====[A-Z]+===|$)')); return m ? m[1].trim() : ''; }
async function recreate(ev){
  ev.preventDefault();
  if (!S.sample) return;
  const url = $('rc-url').value.trim(), text = $('rc-text').value.trim(), file = $('rc-file').files[0];
  if (!text && !file){ msg('rc-msg', 'Paste the transcript or upload the video file. Claude can’t open links by itself.', true); return; }
  msg('rc-msg', '');
  S.busy.rc = true; S.busy.rcText = ''; render();
  let frames = [];
  try { if (file){ if (!S.imgMax) throw {code:'images_unavailable'}; S.busy.rcText = 'Pulling frames from your video…'; render(); frames = await extractFrames(file, Math.min(10, S.imgMax)); S.busy.rcText = ''; render(); } }
  catch(e){ S.busy = {}; render(); msg('rc-msg', e && e.code ? aiErr(e) : "Couldn't read that video file. Try an .mp4, or paste the transcript.", true); return; }
  const prompt = `I want to recreate a short-form video that performed well, in my own style.

ABOUT ME
${ABOUT}

THE VIDEO
Link: ${url || 'not given'}
${text ? 'Transcript / captions:\n"""\n' + text.slice(0, 20000) + '\n"""' : ''}
${frames.length ? `I attached ${frames.length} frames from the video in order, at these seconds: ${frames.map(f => f.t.toFixed(1)).join(', ')}. Read the burned-in captions and on-screen text, and look at framing, shots and edit style.${text ? '' : ' There is no transcript, so reconstruct what is said from the captions and mark guesses with [?].'}` : ''}

Reply in exactly this format, with these three markers and nothing else:
===TITLE===
a short name for this video, max 8 words
===TRANSCRIPT===
a clean transcript with [m:ss] timestamps where you can tell
===PROMPT===
A prompt I will paste into a separate Claude chat that is my AI video editor, along with my raw footage. Address the editor as "you". Plain text, short CAPITALISED headings, in this order:
GOAL: what we're making and target length.
WHY THE ORIGINAL WORKS: the hook (exact first line and what type it is), the beat-by-beat structure with timecodes, the pacing.
MY VERSION: the same structure adapted to my topics and voice, as a ready-to-film script with [VISUAL] cues, plus 3 alternative hook lines.
EDIT INSTRUCTIONS: the first 1.5 seconds, cut rhythm, zooms, captions style, B-roll and sound effects with timecodes, a pattern interrupt every 3 to 5 seconds, and an ending that loops or lands a follow CTA.
POSTING: a caption and 3 to 5 hashtags each for TikTok, Instagram Reels and YouTube Shorts.
WHAT TO SEND BACK: a timecoded cut list, SRT captions and 3 cover text options.`;
  try {
    const opts = {modelTier:'default', cache:false, onText: ({text}) => { const p = section(text, 'PROMPT'); S.busy.rcText = p || 'Writing your editor prompt…'; const o = $('rc-live'); if (o) o.textContent = S.busy.rcText; }};
    if (frames.length) opts.images = frames.map(f => f.blob);
    const r = await S.sample(prompt, opts);
    const id = newId();
    S.busy = {}; S.open = id;
    putDoc('videos', id, {url, platform: detect(url), title: section(r.text, 'TITLE') || 'Untitled video', transcript: section(r.text, 'TRANSCRIPT') || text, prompt: section(r.text, 'PROMPT') || r.text, createdAt: Date.now()});
    for (const k of ['rc-url','rc-text','rc-file']) $(k).value = '';
    toast('Editor prompt ready');
  } catch(e){ S.busy = {}; render(); msg('rc-msg', aiErr(e), true); }
}

/* AI: ideas */
async function ideas(ev){
  ev.preventDefault(); if (!S.sample) return;
  S.busy.ideas = true; msg('id-msg', 'Thinking up ideas…'); render();
  const best = [...S.posts].sort((a,b) => num(b.views)-num(a.views)).slice(0, 6).map(p => `- "${p.title}" on ${PLAT[p.platform]?.name}: ${compact(p.views)} views`).join('\n');
  const news = $('id-news').value.trim();
  const prompt = `Pitch 8 short-form video ideas with a real shot at going viral for this creator.

ABOUT THE CREATOR
${ABOUT}

THEIR BEST POSTS SO FAR
${best || 'none logged yet'}

${news ? `WHAT'S HAPPENING NOW (pasted by the creator on ${today()}):\n${news.slice(0, 8000)}` : `Today is ${today()}. Mix startups, AI, tech news angles and skits. Prefer ideas that don't depend on very recent events.`}

Each idea must be filmable by one person today. Lean on what already worked for them.
Reply with only a JSON array of 8 objects: [{"hook":"the exact first line said on camera","title":"short working title","why":"one sentence on why it could pop"}]`;
  try {
    const r = await S.sample.json(prompt, {modelTier:'default', cache:false});
    const list = (Array.isArray(r) ? r : []).filter(x => x && x.hook).map(x => ({hook:String(x.hook), title:String(x.title||''), why:String(x.why||'')}));
    S.ideas = list; putMeta('ideas', {list, at: Date.now()}); msg('id-msg', list.length ? '' : 'No ideas came back. Try again.', !list.length);
  } catch(e){ msg('id-msg', aiErr(e), true); }
  S.busy.ideas = false; render();
}

/* AI: analyze */
async function analyze(){
  if (!S.sample || !S.posts.length) return;
  S.busy.an = 'Reading your numbers…'; render();
  const rows = S.posts.slice(0, 100).map(p => `${p.date} | ${PLAT[p.platform]?.name} | ${p.title} | ${num(p.views)} views | ${num(p.likes)} likes`).join('\n');
  const prompt = `You're a blunt short-form growth coach. Look at this creator's posts and tell them what to do next.

ABOUT THE CREATOR
${ABOUT}

POSTS (date | platform | video | views | likes)
${rows}

Reply in short Markdown with these ## sections, using "-" bullets, max 3 bullets each:
## What's working
## What's not
## Do this next week
Be specific and cite their posts. If there's too little data to say something, say so in one line.`;
  try {
    const r = await S.sample(prompt, {modelTier:'default', cache:false, onText: ({text}) => { S.busy.an = text; if (view === 'stats') renderStats(); }});
    S.busy.an = null; S.analysis = {text:r.text, at:Date.now()}; putMeta('analysis', S.analysis);
  } catch(e){ S.busy.an = null; toast(aiErr(e)); }
  render();
}

/* events */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, [data-open]'); if (!t) return; const d = t.dataset;
  if (S.confirm && !d.delVideo && !d.delPost) S.confirm = null;
  if (t.id === 'ch-start'){ S.start = today(); render(); saveChallenge(); toast('Day 1. Go post.'); return; }
  if (d.dayPlat){ const t0 = today(), p = d.dayPlat;
    if (S.posts.some(x => x.date === t0 && x.platform === p) && !(S.days[t0]||{})[p]){ toast('Already counted from a post you logged'); return; }
    const cur = {...(S.days[t0] || {})}; cur[p] = !cur[p]; S.days = {...S.days, [t0]: cur}; render(); saveChallenge(); return; }
  if (d.open){ S.open = S.open === d.open ? null : d.open; render(); return; }
  if (d.copy){ const v = S.videos.find(x => x.id === d.copy); if (v) copy(v.prompt || '', t); return; }
  if (d.copyIdea){ const i = S.ideas[Number(d.copyIdea)]; if (i) copy(`${i.hook}\n\n${i.title}: ${i.why}`, t); return; }
  if (d.delVideo){ if (S.confirm === d.delVideo){ S.confirm = null; delDoc('videos', d.delVideo); } else { S.confirm = d.delVideo; render(); } return; }
  if (d.delPost){ if (S.confirm === d.delPost){ S.confirm = null; delDoc('posts', d.delPost); } else { S.confirm = d.delPost; render(); } return; }
  if (t.id === 'an-go'){ analyze(); return; }
});
document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.dataset && ev.target.dataset.open){ ev.preventDefault(); ev.target.click(); } });
$('rc-form').addEventListener('submit', recreate);
$('id-form').addEventListener('submit', ideas);
$('st-form').addEventListener('submit', ev => {
  ev.preventDefault();
  const title = $('st-title').value.trim(), views = $('st-views').value;
  if (!title || views === ''){ toast('Add the video name and views'); return; }
  putDoc('posts', newId(), {date: today(), platform: $('st-plat').value, title, views: num(views), likes: num($('st-likes').value), createdAt: Date.now()});
  for (const k of ['st-title','st-views','st-likes']) $(k).value = '';
  toast('Post logged');
});

boot();
})();
